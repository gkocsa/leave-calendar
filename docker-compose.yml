services:
  postgres:
    image: postgres:16
    container_name: leave-calendar-postgres
    environment:
      POSTGRES_DB: leave_calendar
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: leave_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_user -d leave_calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: leave-calendar-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leave_calendar
      SPRING_DATASOURCE_USERNAME: leave_user
      SPRING_DATASOURCE_PASSWORD: leave_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: leave-calendar-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data: